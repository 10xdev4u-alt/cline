name: desktop-linux-follow

# Auto-follow upstream desktop releases: detect a new cline/cline
# `desktop-vX.Y.Z`, merge it into linux-desktop when clean, build Linux
# artifacts and publish `desktop-linux-vX.Y.Z`. Anything needing judgment
# (merge conflicts) becomes an issue instead of failing silently.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Force version like 0.0.33 (skips detection)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-linux-follow
  cancel-in-progress: false

jobs:
  follow:
    name: Follow upstream desktop release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout linux-desktop with tags
        uses: actions/checkout@v4
        with:
          ref: linux-desktop
          fetch-depth: 0
          fetch-tags: true

      - name: Detect pending upstream versions
        id: detect
        run: |
          FORCE="${{ inputs.version }}"
          if [ -n "$FORCE" ]; then
            echo "$FORCE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must look like X.Y.Z"; exit 1; }
            echo "pending=$FORCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_TAG=$(gh release list --repo cline/cline --exclude-drafts --limit 20 --json tagName \
            | jq -r '[.[] | select(.tagName | test("^desktop-v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tagName')
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "no upstream desktop release found"
            echo "pending=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${UPSTREAM_TAG#desktop-v}"
          if git rev-parse -q --verify "refs/tags/desktop-linux-v$VERSION" >/dev/null; then
            echo "desktop-linux-v$VERSION already released; nothing to do"
            echo "pending=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pending=$VERSION upstream_tag=$UPSTREAM_TAG" | tr ' ' '\n' >> "$GITHUB_OUTPUT"

      - name: Stop when up to date
        if: steps.detect.outputs.pending == ''
        run: echo "Already following latest upstream desktop release."

      - name: Merge upstream tag when clean
        if: steps.detect.outputs.pending != ''
        env:
          VERSION: ${{ steps.detect.outputs.pending }}
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cline/cline.git 2>/dev/null || true
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          if git merge-base --is-ancestor "$UPSTREAM_TAG" HEAD; then
            echo "Upstream $UPSTREAM_TAG already merged; proceeding to build."
            exit 0
          fi
          if git merge --no-edit --no-ff "$UPSTREAM_TAG" -m "chore(desktop): merge $UPSTREAM_TAG into linux-desktop"; then
            git push origin HEAD:linux-desktop
          else
            git merge --abort
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "chore(desktop): rebase linux-desktop onto $UPSTREAM_TAG needed" \
              --body "Auto-follow detected upstream \`$UPSTREAM_TAG\` but the merge conflicts. Rebase \`linux-desktop\` onto it, then re-run this workflow with \`version=$(echo "$VERSION")\`."
            echo "Merge conflicts; issue filed, stopping."
            exit 1
          fi

      - name: Install Tauri Linux system dependencies
        if: steps.detect.outputs.pending != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libfuse2

      - name: Setup Bun
        if: steps.detect.outputs.pending != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Rust
        if: steps.detect.outputs.pending != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install ldd shim for payload binaries
        if: steps.detect.outputs.pending != ''
        run: |
          chmod +x apps/examples/desktop-app/scripts/ci/ldd-payload-shim.sh
          mkdir -p "${RUNNER_TEMP}/ldd-shim"
          cp apps/examples/desktop-app/scripts/ci/ldd-payload-shim.sh "${RUNNER_TEMP}/ldd-shim/ldd"
          chmod +x "${RUNNER_TEMP}/ldd-shim/ldd"
          echo "${RUNNER_TEMP}/ldd-shim" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.detect.outputs.pending != ''
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK packages
        if: steps.detect.outputs.pending != ''
        run: bun run build:sdk

      - name: Build Linux desktop bundles
        if: steps.detect.outputs.pending != ''
        working-directory: apps/examples/desktop-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bunx tauri build --bundles appimage,deb --config src-tauri/tauri.linux-update.conf.json

      - name: Publish release with evergreen asset names
        if: steps.detect.outputs.pending != ''
        env:
          VERSION: ${{ steps.detect.outputs.pending }}
        working-directory: apps/examples/desktop-app
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          OUT="$RUNNER_TEMP/linux-rel"
          mkdir -p "$OUT"
          DEB=$(find "$BUNDLE_DIR/deb" -name '*.deb' -print -quit)
          APP=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage' ! -name '*.tar.gz' -print -quit)
          TAR=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage.tar.gz' -print -quit)
          [ -n "$DEB" ] || { echo "no deb produced"; exit 1; }
          [ -n "$APP" ] || { echo "no AppImage produced"; exit 1; }
          [ -n "$TAR" ] || { echo "no AppImage updater tarball produced (overlay/key issue?)"; exit 1; }
          [ -s "$TAR.sig" ] || { echo "missing updater signature for $TAR"; exit 1; }
          # Unversioned names keep site links evergreen across releases; the
          # versioned updater tarball + sig stay versioned for the feed.
          cp "$DEB" "$OUT/Cline_amd64.deb"
          cp "$APP" "$OUT/Cline_amd64.AppImage"
          cp "$TAR" "$OUT/"
          cp "$TAR.sig" "$OUT/"
          (cd "$OUT" && sha256sum Cline_amd64.deb Cline_amd64.AppImage *.AppImage.tar.gz > SHA256SUMS)
          TAG="desktop-linux-v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --target linux-desktop \
            --title "Cline Desktop for Linux v$VERSION" \
            --notes "Auto-built from upstream \`desktop-v$VERSION\` plus the linux-desktop pipeline. Install: \`sudo apt install ./Cline_amd64.deb\` or \`chmod +x Cline_amd64.AppImage && ./Cline_amd64.AppImage\`. Verify with SHA256SUMS. Installed apps auto-update from the linux-latest feed." \
            "$OUT/Cline_amd64.deb" "$OUT/Cline_amd64.AppImage" "$OUT/$(basename "$TAR")" "$OUT/$(basename "$TAR").sig" "$OUT/SHA256SUMS"

      - name: Refresh linux-latest updater feed
        if: steps.detect.outputs.pending != ''
        env:
          VERSION: ${{ steps.detect.outputs.pending }}
        working-directory: apps/examples/desktop-app
        run: |
          OUT="$RUNNER_TEMP/linux-rel"
          printf 'Cline Desktop for Linux v%s (auto-built).\n' "$VERSION" > "$RUNNER_TEMP/rel-notes.md"
          bun scripts/generate-update-manifest.ts \
            --version "$VERSION" \
            --tag "desktop-linux-v$VERSION" \
            --dir "$OUT" \
            --out "$OUT/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/rel-notes.md"
          cat "$OUT/latest.json"
          if ! gh release view linux-latest >/dev/null 2>&1; then
            gh release create linux-latest \
              --title "Cline desktop Linux (auto-update feed)" \
              --notes "Rolling release backing the Linux desktop auto-updater. Do not delete." \
              --latest=false \
              --target linux-desktop
          fi
          gh release upload linux-latest "$OUT/latest.json" --clobber
